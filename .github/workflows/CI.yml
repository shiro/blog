name: Build package

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Git checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.1.0'
          # cache: 'yarn'

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build
        # env:
          # BASE_PATH: /blog

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.output/public'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
